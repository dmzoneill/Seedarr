<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#EEE"/>
  <!-- Dark inner circle (arr-family style) -->
  <circle cx="256" cy="256" r="220" fill="#3A3F51"/>
  <!-- Seed body - teardrop/seed shape -->
  <path d="M256 120 C310 170 340 230 340 290 C340 336 302 372 256 372 C210 372 172 336 172 290 C172 230 202 170 256 120Z" fill="#35C5F4"/>
  <!-- Seed inner line - cotyledon -->
  <path d="M256 160 C256 160 256 340 256 340" stroke="#3A3F51" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Left cotyledon curve -->
  <path d="M256 220 C230 240 215 270 220 300" stroke="#3A3F51" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Right cotyledon curve -->
  <path d="M256 220 C282 240 297 270 292 300" stroke="#3A3F51" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Sprout emerging from top of seed -->
  <path d="M256 120 C256 100 256 80 256 60" stroke="#35C5F4" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Left leaf -->
  <path d="M256 80 C236 65 220 70 215 85 C210 100 225 105 256 95" fill="#35C5F4"/>
  <!-- Right leaf -->
  <path d="M256 65 C276 50 292 55 297 70 C302 85 287 90 256 80" fill="#35C5F4"/>
  <!-- Upload arrows (BitTorrent seeding concept) -->
  <g stroke="#35C5F4" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7">
    <!-- Left arrow -->
    <path d="M170 410 L170 380 M155 395 L170 380 L185 395"/>
    <!-- Center arrow -->
    <path d="M256 420 L256 390 M241 405 L256 390 L271 405"/>
    <!-- Right arrow -->
    <path d="M342 410 L342 380 M327 395 L342 380 L357 395"/>
  </g>
</svg>
