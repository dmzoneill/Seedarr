name: "Seedarr CodeQL Configuration"

paths-ignore:
  - 'src/**/*.Test/**'
  - 'src/*Test*/**'
  - 'src/NzbDrone.Core.Test/**'
  - 'src/NzbDrone.Integration.Test/**'
  - 'src/NzbDrone.Automation.Test/**'
  - 'src/Seedarr.Api.V1.Test/**'
  - 'src/Seedarr.Http.Test/**'
  - 'src/Seedarr.Frontend/scripts/**'
  - 'tests/**'
  - '**/node_modules/**'
  - '**/obj/**'
  - '**/bin/**'
  - '_output/**'
  - '_temp/**'

query-filters:
  - exclude:
      id:
        - cs/linq/missed-where
        - cs/linq/missed-select
        - cs/catch-of-all-exceptions
        - cs/complex-condition
        - cs/constant-condition
        - cs/useless-upcast
        - cs/missed-ternary-operator
        - cs/empty-catch-block
        - cs/local-not-disposed
        - cs/missed-using-statement
        - cs/inefficient-containskey
        - cs/dereferenced-value-may-be-null
        - cs/unmanaged-code
        - cs/call-to-unmanaged-code
        - cs/path-combine
        - cs/empty-block
        - cs/nested-if-statements
        - cs/useless-assignment-to-local
        - cs/simplifiable-boolean-expression
        - cs/local-shadows-member
        - cs/equality-on-floats
        - cs/useless-cast-to-self
        - cs/reference-equality-with-object
        - cs/dispose-not-called-on-throw
        - cs/static-field-written-by-instance
        - cs/useless-tostring-call
        - cs/useless-if-statement
        - cs/missed-readonly-modifier
        - cs/unused-collection
        - js/unused-local-variable
        - js/useless-assignment-to-local
        - js/trivial-conditional
        - js/superfluous-trailing-arguments
        - js/unneeded-defensive-code
        - cs/log-forging
        - cs/cleartext-storage-of-sensitive-information
        - cs/user-controlled-bypass
        - cs/xml/missing-validation
        - cs/command-line-injection
        - cs/web/missing-function-level-access-control
        - cs/web/insecure-direct-object-reference
