name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore src/Seedarr.sln

      - name: Build
        run: dotnet build src/Seedarr.sln --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format src/Seedarr.sln --verify-no-changes --no-restore

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Seedarr.Frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/Seedarr.Frontend
        run: npm ci

      - name: Lint
        working-directory: src/Seedarr.Frontend
        run: npm run lint

      - name: Type check
        working-directory: src/Seedarr.Frontend
        run: npm run typecheck

      - name: Build
        working-directory: src/Seedarr.Frontend
        run: npm run build
