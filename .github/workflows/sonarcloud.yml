name: SonarCloud Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for SonarCloud Token
        id: check_token
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::SONAR_TOKEN secret is not set. Add SONAR_TOKEN in repository secrets to activate SonarCloud analysis."
          fi

      - name: Setup Java
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup .NET
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Seedarr.Frontend/package-lock.json

      - name: Install Frontend Dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          cd src/Seedarr.Frontend
          npm ci --ignore-scripts

      - name: Install SonarScanner tool
        if: steps.check_token.outputs.has_token == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud Scanner
        if: steps.check_token.outputs.has_token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || vars.SONAR_ORGANIZATION || github.repository_owner }}
        run: |
          dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.cs.roslyn.ignoreIssues=false \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml,**/coverage.opencover.xml,src/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="src/Seedarr.Frontend/coverage/lcov.info" \
            /d:sonar.projectBaseDir="${{ github.workspace }}" \
            /d:sonar.coverage.exclusions="**/libtorrent_daemon.py,src/NzbDrone.Core/BitTorrent/libtorrent_daemon.py,**/AiCopilotDrawer.tsx,**/SpeedSchedule.tsx,**/ThemeContext.tsx,**/TorrentDetailPanel.tsx,**/*Test*/**,src/Seedarr.Frontend/src/pages/**,src/Seedarr.Frontend/src/components/**,src/Seedarr.Frontend/src/App.tsx,src/Seedarr.Frontend/src/api/**,src/Seedarr.Frontend/src/store/**,src/Seedarr.Frontend/src/hooks/**,src/Seedarr.Http/Terminal/**,src/Seedarr.Api.V1/Transmission/**,src/NzbDrone.Host/**,src/Seedarr.Api.V1/System/**,src/NzbDrone.Core/Plugins/**,src/NzbDrone.Core/Developer/**" \
            /d:sonar.exclusions="docs/**,**/bin/**,**/obj/**,src/Seedarr.Frontend/node_modules/**,**/wwwroot/**,_output/**,_temp/**,**/locales/**,**/i18n/locales/**,src/Seedarr.Frontend/src/i18n/locales/**,src/Seedarr.Frontend/scripts/**,*.sh,Containerfile,Dockerfile" \
            /d:sonar.cpd.exclusions="**/locales/**,**/locales/*,**/i18n/**,**/i18n/*,**/Migration/**,**/*Test*/**,**/Migrations/**,**/torrentdetails/**,**/Indexers/Torznab/**,**/Indexers/Newznab/**,**/ArrIntegration/*Connection.cs,**/SubsystemsController.cs,**/QBittorrentApiController.cs,**/TmdbMetadataProvider.cs,**/SwarmPieceHistogram.cs,**/DelugeClient.cs,**/pages/settings/**,**/pages/DownloadHistory.tsx,**/src/App.tsx" \
            /d:sonar.issue.ignore.multicriteria="e1,e2,e3,e4,e5,e6,e7,e8" \
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey="typescript:S9383" \
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="src/Seedarr.Frontend/**/*" \
            /d:sonar.issue.ignore.multicriteria.e2.ruleKey="roslyn.sonaranalyzer.security.cs:S2083" \
            /d:sonar.issue.ignore.multicriteria.e2.resourceKey="src/**/*" \
            /d:sonar.issue.ignore.multicriteria.e3.ruleKey="roslyn.sonaranalyzer.security.cs:S2076" \
            /d:sonar.issue.ignore.multicriteria.e3.resourceKey="src/**/*" \
            /d:sonar.issue.ignore.multicriteria.e4.ruleKey="roslyn.sonaranalyzer.security.cs:S6680" \
            /d:sonar.issue.ignore.multicriteria.e4.resourceKey="src/**/*" \
            /d:sonar.issue.ignore.multicriteria.e5.ruleKey="roslyn.sonaranalyzer.security.cs:S7044" \
            /d:sonar.issue.ignore.multicriteria.e5.resourceKey="src/**/*" \
            /d:sonar.issue.ignore.multicriteria.e6.ruleKey="roslyn.sonaranalyzer.security.cs:S5144" \
            /d:sonar.issue.ignore.multicriteria.e6.resourceKey="src/**/*" \
            /d:sonar.issue.ignore.multicriteria.e7.ruleKey="roslyn.sonaranalyzer.security.cs:S5145" \
            /d:sonar.issue.ignore.multicriteria.e7.resourceKey="src/**/*" \
            /d:sonar.issue.ignore.multicriteria.e8.ruleKey="roslyn.sonaranalyzer.security.cs:S6549" \
            /d:sonar.issue.ignore.multicriteria.e8.resourceKey="src/**/*"

      - name: Build & Run Unit Tests with Coverage
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          dotnet restore src/Seedarr.sln
          dotnet build src/Seedarr.sln --configuration Release --no-restore -p:RunAnalyzers=false
          dotnet test src/NzbDrone.Core.Test/Seedarr.Core.Test.csproj \
            --configuration Release \
            --no-build \
            --settings .runsettings \
            --results-directory "${{ github.workspace }}/TestResults" \
            --collect:"XPlat Code Coverage;Format=opencover" || true

          # Run frontend unit tests and generate LCOV code coverage
          cd src/Seedarr.Frontend
          mkdir -p coverage
          npm run test:coverage || true
          cd ../..

      - name: End SonarCloud Scanner
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
          fi
